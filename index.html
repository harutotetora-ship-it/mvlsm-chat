<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVLsmチャット</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#1e1f22;
color:white;
}

#layout{
display:flex;
height:100vh;
}

/* サイドバー */
#sidebar{
width:180px;
background:#2b2d31;
padding:10px;
box-sizing:border-box;
}

#sidebar button{
width:100%;
margin:5px 0;
padding:8px;
border:none;
border-radius:5px;
background:#40444b;
color:white;
cursor:pointer;
}

#sidebar button:hover{
background:#5865f2;
}

/* チャット */
#chatArea{
flex:1;
display:flex;
flex-direction:column;
background:#313338;
min-width:0;
}

#topBar{
padding:10px;
background:#2b2d31;
font-size:14px;
}

#messages{
flex:1;
overflow-y:auto;
padding:10px;
}

/* メッセージ */
.message{
display:flex;
margin:10px 0;
}

.avatar{
width:32px;
height:32px;
border-radius:50%;
object-fit:cover;
margin-right:7px;
flex-shrink:0;
}

.bubbleWrap{
max-width:70%;
}

.name{
font-size:12px;
color:#bbb;
margin-bottom:3px;
}

.time{
font-size:10px;
color:#888;
margin-left:5px;
}

.bubble{
background:#40444b;
padding:10px;
border-radius:10px;
word-break:break-word;
}

/* 管理者虹色 */
.adminName{
background:linear-gradient(
90deg,
red,
orange,
yellow,
green,
cyan,
blue,
violet
);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

/* 返信表示 */
.replyBox{
background:#2b2d31;
border-left:3px solid #5865f2;
padding:7px;
margin-bottom:5px;
border-radius:4px;
font-size:12px;
max-width:100%;
box-sizing:border-box;
}

.replyTop{
display:flex;
align-items:center;
gap:5px;
margin-bottom:3px;
}

.replyIcon{
width:22px;
height:22px;
border-radius:50%;
object-fit:cover;
}

.replyName{
font-size:11px;
color:#ccc;
font-weight:bold;
}

.replyText{
color:#aaa;
word-break:break-word;
}

/* 返信ボタン */
.replyBtn{
margin-top:5px;
padding:4px 7px;
font-size:11px;
border:none;
border-radius:4px;
background:#40444b;
color:#ccc;
cursor:pointer;
}

.replyBtn:hover{
background:#5865f2;
color:white;
}

/* 入力 */
#inputArea{
display:flex;
padding:10px;
background:#2b2d31;
}

#msg{
flex:1;
padding:10px;
border:none;
border-radius:5px;
outline:none;
box-sizing:border-box;
}

#sendBtn{
margin-left:5px;
padding:10px;
border:none;
border-radius:5px;
background:#5865f2;
color:white;
cursor:pointer;
}

/* アイコン設定 */
#iconArea{
display:flex;
padding:8px 10px;
background:#2b2d31;
border-top:1px solid #40444b;
}

#iconUrl{
flex:1;
padding:8px;
border:none;
border-radius:5px;
box-sizing:border-box;
}

#iconBtn{
margin-left:5px;
padding:8px;
border:none;
border-radius:5px;
background:#40444b;
color:white;
cursor:pointer;
}

/* ログイン */
#login{
max-width:300px;
margin:100px auto;
background:#2b2d31;
padding:20px;
border-radius:10px;
text-align:center;
box-sizing:border-box;
}

#login input{
width:100%;
padding:10px;
margin:5px 0;
border:none;
border-radius:5px;
box-sizing:border-box;
}

#login button{
padding:10px;
margin:5px 2px;
border:none;
border-radius:5px;
cursor:pointer;
background:#5865f2;
color:white;
}

#error{
color:#ff7777;
min-height:20px;
}

#replying{
display:none;
padding:5px 10px;
background:#25262a;
font-size:12px;
color:#bbb;
}

#cancelReply{
margin-left:8px;
padding:2px 6px;
border:none;
border-radius:4px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">

<h2>MVLsmチャット</h2>

<input id="name" placeholder="名前">
<input type="password" id="pass" placeholder="チャットパスワード">

<br>

<button id="loginBtn">入室</button>
<button id="adminBtn">管理者確認</button>

<p id="error"></p>

</div>

<!-- チャット本体 -->
<div id="layout" style="display:none;">

<div id="sidebar">
<button onclick="switchRoom('zatsudan')">⭐ 雑談</button>
<button onclick="switchRoom('bug')">🐛 バグ</button>
<button onclick="switchRoom('update')">📢 更新</button>
</div>

<div id="chatArea">

<div id="topBar">
🟢 オンライン:
<span id="online">読み込み中...</span>
</div>

<div id="messages"></div>

<!-- 返信中表示 -->
<div id="replying">
<span id="replyingText"></span>
<button id="cancelReply">×</button>
</div>

<!-- アイコン設定：必ず表示 -->
<div id="iconArea">
<input id="iconUrl" placeholder="アイコン画像URL">
<button id="iconBtn">アイコン設定</button>
</div>

<!-- 入力 -->
<div id="inputArea">
<input id="msg" placeholder="メッセージ">
<button id="sendBtn">送信</button>
</div>

</div>
</div>

<script type="module">

/* Firebase */
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getDatabase,
ref,
set,
push,
onValue,
onChildAdded,
onDisconnect,
off
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase Authentication */
import {
getAuth,
signInAnonymously,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {

apiKey: "AIzaSyARMFFYZOfZlptX72yn17AqCrXq3vyKK1s",

authDomain: "smtyatto.firebaseapp.com",

databaseURL:
"https://smtyatto-default-rtdb.firebaseio.com",

projectId: "smtyatto",

storageBucket:
"smtyatto.firebasestorage.app",

messagingSenderId:
"720432898013",

appId:
"1:720432898013:web:3fc9bb90082235ab506034"

};


/* =========================
   初期化
========================= */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


/* =========================
   設定
========================= */

const ROOT = "smchat";

/* 管理者UIDをここに入れる */
const ADMIN_UID = "YOUR_ADMIN_UID";


/* =========================
   変数
========================= */

let userId = null;

let username = "名無し";

let currentRoom = "zatsudan";

let isAdmin = false;

let chatRef = null;

let replyTarget = null;


/* =========================
   HTML安全表示用
========================= */

function escapeHTML(text){

const div = document.createElement("div");

div.textContent = String(text || "");

return div.innerHTML;

}


/* =========================
   Firebase Authentication
========================= */

async function startAuthentication(){

try{

if(!auth.currentUser){

await signInAnonymously(auth);

}

}
catch(error){

console.error(error);

document.getElementById("error").innerText =
"Firebase認証エラー: " + error.code;

}

}


/* =========================
   Auth状態監視
========================= */

onAuthStateChanged(auth,(user)=>{

if(user){

userId = user.uid;

isAdmin = userId === ADMIN_UID;

console.log("Firebase UID:",userId);

}

});


/* =========================
   最初に認証開始
========================= */

startAuthentication();


/* =========================
   ユーザー情報保存
========================= */

function saveUser(){

if(!userId) return;

const icon =
localStorage.getItem("icon") ||
"https://via.placeholder.com/64";

set(
ref(db,`${ROOT}/users/${userId}`),
{
name:username,
online:true,
icon:icon,
isAdmin:isAdmin
}
).catch(error=>{

console.error(error);

});

}


/* =========================
   入室
========================= */

document.getElementById("loginBtn").onclick =
async ()=>{

const pass =
document.getElementById("pass").value;

username =
document.getElementById("name").value.trim() || "名無し";


/* 今までのチャットパスワード */
if(pass !== "MvLO"){

document.getElementById("error").innerText =
"パスワードミス";

return;

}


/* Authがまだなら待つ */
if(!auth.currentUser){

await startAuthentication();

}


/* UID取得 */
if(!auth.currentUser){

document.getElementById("error").innerText =
"Firebase Authenticationに接続できません";

return;

}

userId = auth.currentUser.uid;


/* 管理者判定 */
isAdmin = userId === ADMIN_UID;


/* 画面切り替え */
document.getElementById("login").style.display =
"none";

document.getElementById("layout").style.display =
"flex";


/* ユーザー保存 */
saveUser();


/* 切断時オフライン */
onDisconnect(
ref(db,`${ROOT}/users/${userId}`)
).update({
online:false
});


/* チャット開始 */
listenRoom();

};


/* =========================
   管理者確認
========================= */

document.getElementById("adminBtn").onclick =
()=>{

if(!auth.currentUser){

alert("Firebase認証中です。少し待ってからもう一度押してください。");

return;

}

const input =
prompt("管理者UIDを確認します。\nこの端末のUIDを表示しますか？");


if(input === "表示"){

alert(
"あなたのFirebase UID:\n\n" +
auth.currentUser.uid +
"\n\nこれをADMIN_UIDに設定すると管理者になります。"
);

}else{

alert(
"管理者判定はFirebase AuthenticationのUIDで行います。"
);

}

};


/* =========================
   アイコン設定
========================= */

document.getElementById("iconBtn").onclick =
()=>{

const input =
document.getElementById("iconUrl");

const url = input.value.trim();

if(!url){

alert("アイコン画像URLを入力してください");

return;

}


/* localStorage保存 */
localStorage.setItem("icon",url);


/* Firebase保存 */
saveUser();


input.value = "";

alert("アイコン設定完了！");

};


/* =========================
   送信
========================= */

function sendMessage(){

const input =
document.getElementById("msg");

const text =
input.value.trim();

if(!text) return;

if(!userId){

alert("まだFirebase認証が完了していません");

return;

}


/* 現在のアイコン */
const icon =
localStorage.getItem("icon") ||
"https://via.placeholder.com/64";


/* メッセージ */
const messageData = {

userId:userId,

name:username,

text:text,

time:Date.now(),

isAdmin:isAdmin,

icon:icon

};


/* 返信情報 */
if(replyTarget){

messageData.reply = {

userId:replyTarget.userId,

name:replyTarget.name,

text:replyTarget.text,

icon:replyTarget.icon,

isAdmin:replyTarget.isAdmin

};

}


/* Firebase送信 */
push(
ref(db,`${ROOT}/chat/${currentRoom}`),
messageData
)
.then(()=>{

input.value = "";

clearReply();

})
.catch(error=>{

console.error(error);

alert(
"送信できませんでした: " +
error.code
);

});

}


/* =========================
   送信ボタン
========================= */

document.getElementById("sendBtn").onclick =
sendMessage;


/* =========================
   Enter送信
========================= */

document.getElementById("msg").addEventListener(
"keydown",
(e)=>{

if(e.key === "Enter" &&
!e.shiftKey){

e.preventDefault();

sendMessage();

}

}
);


/* =========================
   返信設定
========================= */

function setReply(data){

replyTarget = {

userId:data.userId || "",

name:data.name || "名無し",

text:data.text || "",

icon:data.icon ||
"https://via.placeholder.com/64",

isAdmin:!!data.isAdmin

};


document.getElementById("replyingText").innerText =
"返信中: " +
replyTarget.name +
"「" +
replyTarget.text.slice(0,30) +
"」";


document.getElementById("replying").style.display =
"block";


document.getElementById("msg").focus();

}


/* =========================
   返信解除
========================= */

function clearReply(){

replyTarget = null;

document.getElementById("replying").style.display =
"none";

document.getElementById("replyingText").innerText =
"";

}


document.getElementById("cancelReply").onclick =
clearReply;


/* =========================
   ルーム切り替え
========================= */

window.switchRoom = function(room){

currentRoom = room;


/* 返信解除 */
clearReply();


/* 画面クリア */
document.getElementById("messages").innerHTML =
"";


/* 古い監視停止 */
if(chatRef){

off(chatRef);

}


/* 新しい部屋 */
listenRoom();

};


/* =========================
   チャット監視
========================= */

function listenRoom(){

if(!userId) return;

chatRef =
ref(db,`${ROOT}/chat/${currentRoom}`);


onChildAdded(chatRef,(snap)=>{

const d = snap.val();

if(!d) return;


/* 時間 */
const date =
new Date(d.time || Date.now());

const time =
String(date.getHours()).padStart(2,"0") +
":" +
String(date.getMinutes()).padStart(2,"0");


/* アイコン */
const icon =
d.icon ||
"https://via.placeholder.com/64";


/* メッセージ作成 */
const div =
document.createElement("div");

div.className =
"message";


/* =========================
   返信HTML
========================= */

let replyHTML = "";


if(d.reply){

const replyIcon =
escapeHTML(
d.reply.icon ||
"https://via.placeholder.com/64"
);

const replyName =
escapeHTML(
d.reply.name ||
"名無し"
);

const replyText =
escapeHTML(
d.reply.text ||
""
);


replyHTML = `

<div class="replyBox">

<div class="replyTop">

<img
class="replyIcon"
src="${replyIcon}"
onerror="this.src='https://via.placeholder.com/64'"
>

<div class="replyName">
${replyName}
</div>

</div>

<div class="replyText">
${replyText}
</div>

</div>

`;

}


/* 名前 */
const nameClass =
d.isAdmin ?
"adminName" :
"";


/* =========================
   表示
========================= */

div.innerHTML = `

<img
class="avatar"
src="${escapeHTML(icon)}"
onerror="this.src='https://via.placeholder.com/64'"
>

<div class="bubbleWrap">

${replyHTML}

<div class="name">

<b class="${nameClass}">
${escapeHTML(d.name)}
</b>

<span class="time">
${time}
</span>

</div>

<div class="bubble">
${escapeHTML(d.text)}
</div>

<button class="replyBtn">
返信
</button>

</div>

`;


/* =========================
   返信ボタン
========================= */

div.querySelector(".replyBtn").onclick =
()=>{

setReply(d);

};


/* 表示 */
document.getElementById("messages")
.appendChild(div);


/* 下までスクロール */
document.getElementById("messages").scrollTop =
document.getElementById("messages").scrollHeight;

});

}


/* =========================
   オンライン一覧
========================= */

onValue(
ref(db,`${ROOT}/users`),
(snap)=>{

const onlineElement =
document.getElementById("online");

if(!onlineElement) return;


const data =
snap.val() || {};


const names = [];


Object.values(data).forEach(u=>{

if(u && u.online){

names.push(
u.name || "名無し"
);

}

});


onlineElement.innerText =
names.length ?
names.join(" ") :
"なし";

}
);

</script>

</body>
</html>
