<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVLsmチャット</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:sans-serif;
  background:#1e1f22;
  color:white;
}

button{
  border:none;
  border-radius:6px;
  padding:10px;
  cursor:pointer;
  color:white;
}

/* ログイン */
#login{
  width:min(90%,400px);
  margin:80px auto;
  padding:25px;
  background:#2b2d31;
  border-radius:12px;
  text-align:center;
}

#login input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:6px;
}

#loginBtn{background:#5865f2}
#adminBtn{background:#555}
#error{color:#ff9999}

/* メイン */
#layout{
  display:flex;
  height:100vh;
}

#sidebar{
  width:180px;
  padding:10px;
  background:#2b2d31;
  flex-shrink:0;
}

#sidebar button{
  width:100%;
  margin:5px 0;
  background:#40444b;
}

#chatArea{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#313338;
}

#topBar{
  padding:12px;
  background:#2b2d31;
}

#roomName{
  font-size:18px;
  font-weight:bold;
}

#online{
  font-size:13px;
  color:#bbb;
}

/* メッセージ */
#messages{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.message{
  display:flex;
  gap:10px;
  margin:12px 0;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#555;
  flex-shrink:0;
}

.bubbleWrap{
  max-width:75%;
  min-width:0;
}

.nameLine{
  margin-bottom:4px;
}

.name{
  font-size:14px;
  color:#ddd;
}

.time{
  font-size:11px;
  color:#888;
  margin-left:6px;
}

.bubble{
  background:#40444b;
  padding:10px 12px;
  border-radius:10px;
  white-space:pre-wrap;
  word-break:break-word;
}

/* 管理者虹色 */
.adminName{
  background:linear-gradient(
    90deg,red,orange,yellow,lime,cyan,blue,violet,red
  );
  background-size:400% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:rainbow 4s linear infinite;
}

@keyframes rainbow{
  from{background-position:0%}
  to{background-position:400%}
}

/* 返信先表示 */
.replyPreview{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  margin-bottom:5px;
  background:#292b2f;
  border-left:3px solid #5865f2;
  border-radius:6px;
}

.replyPreview img{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
}

.replyInfo{
  min-width:0;
}

.replyName{
  font-size:12px;
  color:#ddd;
}

.replyText{
  font-size:12px;
  color:#999;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.replyBtn{
  margin-top:5px;
  padding:5px 9px;
  background:#555;
  font-size:12px;
}

/* 返信中 */
#replyBar{
  display:none;
  padding:8px 12px;
  background:#25262a;
  gap:8px;
  align-items:center;
}

#replyingText{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#bbb;
}

#cancelReplyBtn{
  background:#555;
  padding:6px 10px;
}

/* 入力 */
#inputArea{
  display:flex;
  padding:10px;
  background:#2b2d31;
}

#msg{
  flex:1;
  min-width:0;
  padding:12px;
  border:none;
  border-radius:6px;
  outline:none;
}

#sendBtn{
  margin-left:7px;
  background:#5865f2;
}

/* アイコン設定 */
#iconPanel{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
}

#iconBox{
  width:min(90%,400px);
  background:#2b2d31;
  padding:20px;
  border-radius:12px;
}

#iconUrl{
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
}

#saveIconBtn{background:#5865f2}
#closeIconBtn{background:#555}

/* スマホ */
@media(max-width:600px){
  #sidebar{
    width:85px;
    padding:5px;
  }

  #sidebar button{
    font-size:11px;
    padding:8px 3px;
  }

  .bubbleWrap{
    max-width:calc(100% - 50px);
  }
}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
  <h2>MVLsmチャット</h2>

  <input id="name" placeholder="名前" maxlength="30">
  <input id="pass" type="password" placeholder="チャットパスワード">

  <br>

  <button id="loginBtn">入室</button>
  <button id="adminBtn">管理者確認</button>

  <p id="error"></p>
</div>

<!-- メイン画面 -->
<div id="layout" style="display:none;">

  <div id="sidebar">
    <button onclick="switchRoom('zatsudan')">⭐ 雑談</button>
    <button onclick="switchRoom('bug')">🐛 バグ</button>
    <button onclick="switchRoom('update')">📢 更新</button>

    <hr>

    <button id="iconSettingBtn">🖼️ アイコン設定</button>
  </div>

  <div id="chatArea">

    <div id="topBar">
      <div id="roomName">⭐ 雑談</div>
      🟢 オンライン: <span id="online">読み込み中...</span>
    </div>

    <div id="messages"></div>

    <!-- 返信中 -->
    <div id="replyBar">
      <span id="replyingText"></span>
      <button id="cancelReplyBtn">×</button>
    </div>

    <!-- 入力 -->
    <div id="inputArea">
      <input id="msg" placeholder="メッセージ">
      <button id="sendBtn">送信</button>
    </div>

  </div>
</div>

<!-- アイコン設定 -->
<div id="iconPanel">
  <div id="iconBox">
    <h2>アイコン設定</h2>

    <input id="iconUrl" placeholder="画像のURLを入力">

    <br><br>

    <button id="closeIconBtn">閉じる</button>
    <button id="saveIconBtn">保存</button>
  </div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  update,
  push,
  onValue,
  onChildAdded,
  onDisconnect,
  off
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* Firebase設定
   ★ Firebase ConsoleのConfigからコピーしたもの */
const firebaseConfig = {
  apiKey: "AIzaSyARMFFYzOfZlptX72yn17AqCrXq3vyKK1s",
  authDomain: "smtyatto.firebaseapp.com",
  databaseURL: "https://smtyatto-default-rtdb.firebaseio.com",
  projectId: "smtyatto",
  storageBucket: "smtyatto.firebasestorage.app",
  messagingSenderId: "720432898013",
  appId: "1:720432898013:web:3fc9bb90082235ab506034",
  measurementId: "G-2NJNZJ46K0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* 設定 */
const ROOT = "smchat";
const CHAT_PASSWORD = "MvLO";

/* 管理者パスワード */
const ADMIN_PASSWORD = "admin123";

/* 変数 */
let userId = "";
let username = "名無し";
let currentRoom = "zatsudan";
let isAdmin = false;
let chatRef = null;
let replyData = null;

let myIcon = localStorage.getItem("mvlsm_icon") ||
"https://via.placeholder.com/40";

/* ルーム名 */
const roomNames = {
  zatsudan:"⭐ 雑談",
  bug:"🐛 バグ",
  update:"📢 更新"
};

/* 時間 */
function formatTime(timestamp){
  const date = new Date(timestamp || Date.now());

  return date.getHours() + ":" +
    String(date.getMinutes()).padStart(2,"0");
}

/* Firebase認証 */
async function firebaseLogin(){
  const result = await signInAnonymously(auth);
  userId = result.user.uid;
}

/* 入室 */
async function login(){

  const error = document.getElementById("error");
  error.textContent = "";

  const pass = document.getElementById("pass").value;

  username =
    document.getElementById("name").value.trim() ||
    "名無し";

  if(pass !== CHAT_PASSWORD){
    error.textContent = "チャットパスワードが違います";
    return;
  }

  try{

    error.textContent = "Firebaseに接続中...";

    await firebaseLogin();

    const userRef = ref(db,`${ROOT}/users/${userId}`);

    await set(userRef,{
      name:username,
      online:true,
      icon:myIcon,
      isAdmin:isAdmin
    });

    onDisconnect(userRef).set({
      name:username,
      online:false,
      icon:myIcon,
      isAdmin:isAdmin
    });

    document.getElementById("login").style.display = "none";
    document.getElementById("layout").style.display = "flex";

    listenRoom();
    listenOnline();

  }catch(e){

    console.error(e);

    error.textContent =
      "Firebaseエラー: " + e.message;
  }
}

/* 管理者確認 */
function adminCheck(){

  const pass = prompt("管理者パスワード");

  if(pass === ADMIN_PASSWORD){
    isAdmin = true;
    alert("管理者モードON！");
  }else if(pass !== null){
    alert("管理者パスワードが違います");
  }
}

/* 送信 */
async function sendMessage(){

  const input = document.getElementById("msg");
  const text = input.value.trim();

  if(!text) return;

  if(!userId){
    alert("まだログインしていません");
    return;
  }

  const data = {
    userId:userId,
    name:username,
    text:text,
    icon:myIcon,
    time:Date.now(),
    isAdmin:isAdmin
  };

  /* 返信情報 */
  if(replyData){
    data.reply = {
      messageKey:replyData.messageKey,
      name:replyData.name,
      text:replyData.text,
      icon:replyData.icon
    };
  }

  try{

    await push(
      ref(db,`${ROOT}/chat/${currentRoom}`),
      data
    );

    input.value = "";
    cancelReply();

  }catch(e){

    console.error(e);
    alert("送信できませんでした: " + e.message);

  }
}

/* ルーム変更 */
window.switchRoom = function(room){

  currentRoom = room;

  document.getElementById("roomName").textContent =
    roomNames[room] || room;

  document.getElementById("messages").innerHTML = "";

  if(chatRef){
    off(chatRef);
  }

  cancelReply();
  listenRoom();
};

/* 受信開始 */
function listenRoom(){

  chatRef = ref(
    db,
    `${ROOT}/chat/${currentRoom}`
  );

  onChildAdded(chatRef,(snap)=>{

    const data = snap.val();

    if(data){
      addMessage(data,snap.key);
    }

  });
}

/* メッセージ表示 */
function addMessage(d,key){

  const messages = document.getElementById("messages");

  const div = document.createElement("div");
  div.className = "message";
  div.id = "message-" + key;

  /* アイコン */
  const avatar = document.createElement("img");
  avatar.className = "avatar";
  avatar.src = d.icon || "https://via.placeholder.com/40";
  avatar.onerror = function(){
    this.src = "https://via.placeholder.com/40";
  };

  /* 本体 */
  const wrap = document.createElement("div");
  wrap.className = "bubbleWrap";

  /* 名前 */
  const nameLine = document.createElement("div");
  nameLine.className = "nameLine";

  const name = document.createElement("span");
  name.className = "name";

  if(d.isAdmin){
    name.classList.add("adminName");
  }

  name.textContent = d.name || "名無し";

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = formatTime(d.time);

  nameLine.appendChild(name);
  nameLine.appendChild(time);

  wrap.appendChild(nameLine);

  /* 返信の場合
     アイコン 名前
     話す内容 */
  if(d.reply){

    const replyBox = document.createElement("div");
    replyBox.className = "replyPreview";

    const replyIcon = document.createElement("img");
    replyIcon.src =
      d.reply.icon ||
      "https://via.placeholder.com/40";

    replyIcon.onerror = function(){
      this.src = "https://via.placeholder.com/40";
    };

    const replyInfo = document.createElement("div");
    replyInfo.className = "replyInfo";

    const replyName = document.createElement("div");
    replyName.className = "replyName";
    replyName.textContent = d.reply.name || "名無し";

    const replyText = document.createElement("div");
    replyText.className = "replyText";
    replyText.textContent = d.reply.text || "";

    replyInfo.appendChild(replyName);
    replyInfo.appendChild(replyText);

    replyBox.appendChild(replyIcon);
    replyBox.appendChild(replyInfo);

    replyBox.onclick = function(){

      const target = document.getElementById(
        "message-" + d.reply.messageKey
      );

      if(target){
        target.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });
      }
    };

    wrap.appendChild(replyBox);
  }

  /* 本文 */
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = d.text || "";

  wrap.appendChild(bubble);

  /* 返信ボタン */
  const replyBtn = document.createElement("button");
  replyBtn.className = "replyBtn";
  replyBtn.textContent = "返信";

  replyBtn.onclick = function(){

    startReply({
      messageKey:key,
      name:d.name || "名無し",
      text:d.text || "",
      icon:d.icon || "https://via.placeholder.com/40"
    });

  };

  wrap.appendChild(replyBtn);

  div.appendChild(avatar);
  div.appendChild(wrap);

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;
}

/* 返信開始 */
function startReply(data){

  replyData = data;

  document.getElementById("replyBar").style.display = "flex";

  document.getElementById("replyingText").textContent =
    data.name + " に返信: " + data.text;

  document.getElementById("msg").focus();
}

/* 返信キャンセル */
function cancelReply(){

  replyData = null;

  document.getElementById("replyBar").style.display = "none";

  document.getElementById("replyingText").textContent = "";
}

/* オンライン表示 */
function listenOnline(){

  onValue(ref(db,`${ROOT}/users`),(snap)=>{

    const online = document.getElementById("online");

    const data = snap.val() || {};

    const users = Object.values(data).filter(
      u => u && u.online
    );

    const names = users.map(
      u => u.name || "名無し"
    );

    online.textContent =
      users.length + "人" +
      (names.length ? " (" + names.join("、") + ")" : "");
  });
}

/* アイコン設定を開く */
function openIconPanel(){

  document.getElementById("iconUrl").value = myIcon;

  document.getElementById("iconPanel").style.display = "flex";
}

/* 閉じる */
function closeIconPanel(){
  document.getElementById("iconPanel").style.display = "none";
}

/* アイコン保存 */
async function saveIcon(){

  const newIcon =
    document.getElementById("iconUrl").value.trim();

  if(!newIcon){
    alert("画像URLを入力してください");
    return;
  }

  myIcon = newIcon;

  localStorage.setItem("mvlsm_icon",myIcon);

  if(userId){

    try{

      await update(
        ref(db,`${ROOT}/users/${userId}`),
        {
          icon:myIcon,
          name:username,
          isAdmin:isAdmin
        }
      );

    }catch(e){
      console.error(e);
    }
  }

  closeIconPanel();

  alert("アイコンを保存しました！");
}

/* ボタン設定 */
document.getElementById("loginBtn")
.addEventListener("click",login);

document.getElementById("adminBtn")
.addEventListener("click",adminCheck);

document.getElementById("sendBtn")
.addEventListener("click",sendMessage);

document.getElementById("cancelReplyBtn")
.addEventListener("click",cancelReply);

document.getElementById("iconSettingBtn")
.addEventListener("click",openIconPanel);

document.getElementById("closeIconBtn")
.addEventListener("click",closeIconPanel);

document.getElementById("saveIconBtn")
.addEventListener("click",saveIcon);

/* Enter送信 */
document.getElementById("msg")
.addEventListener("keydown",(e)=>{
  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }
});

/* パスワード欄でEnter */
document.getElementById("pass")
.addEventListener("keydown",(e)=>{
  if(e.key === "Enter"){
    e.preventDefault();
    login();
  }
});

</script>

</body>
</html>
