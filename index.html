<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MVLsmチャット</title>

<style>

/* =====================
   全体
===================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:sans-serif;
  background:#1e1f22;
  color:white;
}

button{
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:white;
}

/* =====================
   ログイン
===================== */

#login{
  width:min(90%,400px);
  margin:80px auto;
  padding:30px;
  background:#2b2d31;
  border-radius:15px;
  text-align:center;
}

#login h1{
  margin-top:0;
}

.loginInput{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:7px;
  font-size:16px;
}

#login button{
  padding:12px 18px;
  margin:8px 3px;
  background:#5865f2;
  font-size:16px;
}

#error{
  color:#ff9b9b;
  word-break:break-word;
}

/* =====================
   レイアウト
===================== */

#layout{
  display:flex;
  height:100vh;
}

/* =====================
   サイドバー
===================== */

#sidebar{
  width:190px;
  padding:10px;
  background:#2b2d31;
  flex-shrink:0;
}

#sidebar h2{
  font-size:18px;
  margin:10px;
}

.roomBtn,
.settingBtn{
  width:100%;
  margin:5px 0;
  padding:10px;
  background:#40444b;
  text-align:left;
}

.roomBtn:hover,
.settingBtn:hover{
  background:#5865f2;
}

/* =====================
   チャット
===================== */

#chatArea{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#313338;
}

#topBar{
  padding:12px;
  background:#2b2d31;
  border-bottom:1px solid #1e1f22;
}

#roomName{
  font-size:18px;
  font-weight:bold;
}

#online{
  margin-top:5px;
  font-size:12px;
  color:#aaa;
}

/* =====================
   メッセージ一覧
===================== */

#messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

/* =====================
   メッセージ
===================== */

.message{
  display:flex;
  gap:10px;
  margin:12px 0;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  background:#555;
  flex-shrink:0;
}

.bubbleWrap{
  max-width:75%;
  min-width:0;
}

.nameLine{
  margin-bottom:4px;
}

.name{
  font-size:14px;
  color:#ddd;
}

.time{
  font-size:11px;
  color:#888;
  margin-left:7px;
}

.bubble{
  padding:10px 13px;
  background:#40444b;
  border-radius:10px;
  white-space:pre-wrap;
  word-break:break-word;
}

/* =====================
   管理者虹色
===================== */

.adminName{
  background:linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    #668cff,
    violet,
    red
  );
  background-size:400% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:rainbow 4s linear infinite;
}

@keyframes rainbow{
  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:400% 50%;
  }
}

/* =====================
   返信表示
===================== */

.replyPreview{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  margin-bottom:5px;
  background:#35373c;
  border-left:3px solid #5865f2;
  border-radius:6px;
  cursor:pointer;
}

.replyPreview img{
  width:24px;
  height:24px;
  border-radius:50%;
  object-fit:cover;
  background:#555;
  flex-shrink:0;
}

.replyPreviewInfo{
  min-width:0;
}

.replyPreviewName{
  font-size:12px;
  color:#ccc;
}

.replyPreviewText{
  font-size:12px;
  color:#999;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:300px;
}

/* =====================
   メッセージ操作
===================== */

.messageActions{
  margin-top:4px;
}

.replyBtn{
  padding:4px 8px;
  background:#555;
  font-size:12px;
}

.replyBtn:hover{
  background:#5865f2;
}

/* =====================
   返信入力中
===================== */

#replyBar{
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:#25262a;
  border-top:1px solid #1e1f22;
}

#replyingText{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#bbb;
  font-size:13px;
}

#cancelReplyBtn{
  background:#555;
  padding:6px 10px;
}

/* =====================
   入力欄
===================== */

#inputArea{
  display:flex;
  padding:10px;
  background:#2b2d31;
}

#msg{
  flex:1;
  min-width:0;
  padding:12px;
  border:none;
  border-radius:7px;
  outline:none;
  font-size:15px;
}

#sendBtn{
  margin-left:7px;
  padding:10px 16px;
  background:#5865f2;
}

/* =====================
   アイコン設定
===================== */

#iconPanel{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:10;
  justify-content:center;
  align-items:center;
}

#iconBox{
  width:min(90%,400px);
  background:#2b2d31;
  padding:20px;
  border-radius:12px;
}

#iconBox h2{
  margin-top:0;
}

#iconUrl{
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
}

.iconButtons{
  margin-top:12px;
  text-align:right;
}

.iconButtons button{
  padding:9px 13px;
  margin-left:5px;
}

#saveIconBtn{
  background:#5865f2;
}

#closeIconBtn{
  background:#555;
}

/* =====================
   スマホ
===================== */

@media(max-width:600px){

  #sidebar{
    width:80px;
    padding:5px;
  }

  #sidebar h2{
    display:none;
  }

  .roomBtn,
  .settingBtn{
    font-size:11px;
    text-align:center;
    padding:8px 3px;
  }

  .bubbleWrap{
    max-width:calc(100% - 50px);
  }

  #messages{
    padding:8px;
  }

}

</style>
</head>

<body>

<!-- =====================
     ログイン
===================== -->

<div id="login">

  <h1>MVLsmチャット</h1>

  <input
    id="name"
    class="loginInput"
    type="text"
    placeholder="名前"
    maxlength="30"
  >

  <input
    id="pass"
    class="loginInput"
    type="password"
    placeholder="チャットパスワード"
  >

  <br>

  <button id="loginBtn">入室</button>
  <button id="adminBtn">管理者確認</button>

  <p id="error"></p>

</div>


<!-- =====================
     メイン
===================== -->

<div id="layout" style="display:none;">

  <!-- サイドバー -->

  <div id="sidebar">

    <h2>MVLsmチャット</h2>

    <button class="roomBtn" onclick="switchRoom('zatsudan')">
      ⭐ 雑談
    </button>

    <button class="roomBtn" onclick="switchRoom('bug')">
      🐛 バグ
    </button>

    <button class="roomBtn" onclick="switchRoom('update')">
      📢 更新
    </button>

    <hr style="border-color:#444;">

    <button
      class="settingBtn"
      id="iconSettingBtn"
    >
      🖼️ アイコン設定
    </button>

  </div>


  <!-- チャット -->

  <div id="chatArea">

    <div id="topBar">

      <div id="roomName">
        ⭐ 雑談
      </div>

      <div>
        🟢 オンライン:
        <span id="online">読み込み中...</span>
      </div>

    </div>


    <div id="messages"></div>


    <!-- 返信中 -->

    <div id="replyBar">

      <div id="replyingText">
        返信中
      </div>

      <button id="cancelReplyBtn">
        ×
      </button>

    </div>


    <!-- 入力 -->

    <div id="inputArea">

      <input
        id="msg"
        placeholder="メッセージ"
        maxlength="2000"
      >

      <button id="sendBtn">
        送信
      </button>

    </div>

  </div>

</div>


<!-- =====================
     アイコン設定画面
===================== -->

<div id="iconPanel">

  <div id="iconBox">

    <h2>アイコン設定</h2>

    <input
      id="iconUrl"
      type="text"
      placeholder="画像URLを入力"
    >

    <div class="iconButtons">

      <button id="closeIconBtn">
        閉じる
      </button>

      <button id="saveIconBtn">
        保存
      </button>

    </div>

  </div>

</div>


<script type="module">

/* =====================
   Firebase
===================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  onChildAdded,
  onDisconnect,
  off
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";


/* =====================
   Firebase設定
===================== */

const firebaseConfig = {

  apiKey: "AIzaSyARMFFYzOfZlptX72yn17AqCrXq3vyKK1s",

  authDomain: "smtyatto.firebaseapp.com",

  databaseURL:
  "https://smtyatto-default-rtdb.firebaseio.com",

  projectId: "smtyatto",

  storageBucket:
  "smtyatto.firebasestorage.app",

  messagingSenderId:
  "720432898013",

  appId:
  "1:720432898013:web:3fc9bb90082235ab506034",

  measurementId:
  "G-2NJNZJ46K0"

};


/* =====================
   Firebase開始
===================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =====================
   統一設定
===================== */

const ROOT = "smchat";

/*
  チャット入室パスワード
*/
const CHAT_PASSWORD = "MvLO";

/*
  管理者パスワード

  注意：
  これは「管理者表示をONにするための
  フロント側の確認」です。

  本当に管理者だけ書き込みを許可する等の
  権限管理はFirebase Rulesで行う。
*/
const ADMIN_PASSWORD = "admin123";


/* =====================
   変数
===================== */

let userId = "";

let username = "名無し";

let currentRoom = "zatsudan";

let isAdmin = false;

let chatRef = null;

let myIcon =
  localStorage.getItem("mvlsm_icon")
  ||
  "https://via.placeholder.com/40";

let replyData = null;


/* =====================
   HTML安全表示
===================== */

function escapeHTML(text){

  const div = document.createElement("div");

  div.textContent =
    String(text ?? "");

  return div.innerHTML;

}


/* =====================
   時間
===================== */

function formatTime(timestamp){

  const date =
    new Date(timestamp || Date.now());

  return (
    date.getHours()
    +
    ":"
    +
    String(
      date.getMinutes()
    ).padStart(2,"0")
  );

}


/* =====================
   ルーム名
===================== */

const roomNames = {

  zatsudan:"⭐ 雑談",

  bug:"🐛 バグ",

  update:"📢 更新"

};


/* =====================
   Firebase匿名ログイン
===================== */

async function firebaseLogin(){

  const result =
    await signInAnonymously(auth);

  userId = result.user.uid;

  console.log(
    "Firebase認証成功:",
    userId
  );

}


/* =====================
   入室
===================== */

async function login(){

  const error =
    document.getElementById("error");

  error.textContent = "";

  const pass =
    document.getElementById("pass").value;

  username =
    document.getElementById("name").value.trim()
    ||
    "名無し";


  if(pass !== CHAT_PASSWORD){

    error.textContent =
      "チャットパスワードが違います";

    return;

  }


  try{

    error.textContent =
      "Firebaseに接続中...";


    await firebaseLogin();


    document.getElementById("login")
      .style.display = "none";

    document.getElementById("layout")
      .style.display = "flex";


    const userRef =
      ref(
        db,
        `${ROOT}/users/${userId}`
      );


    await set(userRef,{

      name:username,

      online:true,

      icon:myIcon,

      isAdmin:isAdmin

    });


    onDisconnect(userRef).set({

      name:username,

      online:false,

      icon:myIcon,

      isAdmin:isAdmin

    });


    listenRoom();

    listenOnline();


  }catch(e){

    console.error(e);

    error.textContent =
      "Firebase認証エラー: "
      +
      e.message;

  }

}


/* =====================
   管理者確認
===================== */

function adminCheck(){

  const pass =
    prompt("管理者パスワード");

  if(pass === null){
    return;
  }


  if(pass === ADMIN_PASSWORD){

    isAdmin = true;

    alert(
      "管理者モードON！\n名前が虹色になります。"
    );

  }else{

    alert(
      "管理者パスワードが違います"
    );

  }

}


/* =====================
   送信
===================== */

async function sendMessage(){

  const input =
    document.getElementById("msg");

  const text =
    input.value.trim();


  if(!text){
    return;
  }


  if(!userId){

    alert(
      "Firebase認証が完了していません"
    );

    return;

  }


  try{

    const messageData = {

      userId:userId,

      name:username,

      text:text,

      icon:myIcon,

      time:Date.now(),

      isAdmin:isAdmin

    };


    /* 返信がある場合 */

    if(replyData){

      messageData.reply = {

        messageKey:
          replyData.messageKey,

        name:
          replyData.name,

        text:
          replyData.text,

        icon:
          replyData.icon

      };

    }


    await push(
      ref(
        db,
        `${ROOT}/chat/${currentRoom}`
      ),
      messageData
    );


    input.value = "";

    cancelReply();


  }catch(e){

    console.error(e);

    alert(
      "送信できませんでした: "
      +
      e.message
    );

  }

}


/* =====================
   ルーム変更
===================== */

window.switchRoom =
function(room){

  if(!userId){
    return;
  }


  currentRoom = room;


  document.getElementById("roomName")
    .textContent =
    roomNames[room]
    ||
    room;


  document.getElementById("messages")
    .innerHTML = "";


  if(chatRef){

    off(chatRef);

  }


  cancelReply();

  listenRoom();

};


/* =====================
   チャット受信
===================== */

function listenRoom(){

  chatRef =
    ref(
      db,
      `${ROOT}/chat/${currentRoom}`
    );


  onChildAdded(
    chatRef,
    (snap)=>{

      const d =
        snap.val()
        ||
        {};

      const key =
        snap.key;


      addMessageToScreen(
        d,
        key
      );

    }
  );

}


/* =====================
   画面にメッセージ追加
===================== */

function addMessageToScreen(
  d,
  key
){

  const messages =
    document.getElementById("messages");


  const div =
    document.createElement("div");

  div.className =
    "message";

  div.id =
    "message-" + key;


  /* ---------------------
     アイコン
  --------------------- */

  const avatar =
    document.createElement("img");

  avatar.className =
    "avatar";

  avatar.src =
    d.icon
    ||
    "https://via.placeholder.com/40";

  avatar.alt =
    "アイコン";


  avatar.onerror =
    ()=>{
      avatar.src =
        "https://via.placeholder.com/40";
    };


  /* ---------------------
     右側
  --------------------- */

  const wrap =
    document.createElement("div");

  wrap.className =
    "bubbleWrap";


  /* ---------------------
     名前
  --------------------- */

  const nameLine =
    document.createElement("div");

  nameLine.className =
    "nameLine";


  const name =
    document.createElement("span");

  name.className =
    "name";


  if(d.isAdmin){

    name.classList.add(
      "adminName"
    );

  }


  name.textContent =
    d.name
    ||
    "名無し";


  const time =
    document.createElement("span");

  time.className =
    "time";

  time.textContent =
    formatTime(d.time);


  nameLine.appendChild(name);

  nameLine.appendChild(time);


  /* ---------------------
     返信表示

     返信の場合：

     アイコン 名前
     話す内容

  --------------------- */

  if(d.reply){

    const replyBox =
      document.createElement("div");

    replyBox.className =
      "replyPreview";


    const replyIcon =
      document.createElement("img");

    replyIcon.src =
      d.reply.icon
      ||
      "https://via.placeholder.com/40";

    replyIcon.alt =
      "返信先アイコン";

    replyIcon.onerror =
      ()=>{
        replyIcon.src =
          "https://via.placeholder.com/40";
      };


    const replyInfo =
      document.createElement("div");

    replyInfo.className =
      "replyPreviewInfo";


    const replyName =
      document.createElement("div");

    replyName.className =
      "replyPreviewName";

    replyName.textContent =
      d.reply.name
      ||
      "名無し";


    const replyText =
      document.createElement("div");

    replyText.className =
      "replyPreviewText";

    replyText.textContent =
      d.reply.text
      ||
      "";


    replyInfo.appendChild(replyName);

    replyInfo.appendChild(replyText);


    replyBox.appendChild(replyIcon);

    replyBox.appendChild(replyInfo);


    /* クリックしたら元メッセージへ */

    replyBox.onclick =
      ()=>{

        const target =
          document.getElementById(
            "message-"
            +
            d.reply.messageKey
          );


        if(target){

          target.scrollIntoView({
            behavior:"smooth",
            block:"center"
          });

        }

      };


    wrap.appendChild(replyBox);

  }


  /* ---------------------
     本文
  --------------------- */

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    d.text
    ||
    "";


  /* ---------------------
     返信ボタン
  --------------------- */

  const actions =
    document.createElement("div");

  actions.className =
    "messageActions";


  const replyBtn =
    document.createElement("button");

  replyBtn.className =
    "replyBtn";

  replyBtn.textContent =
    "返信";


  replyBtn.onclick =
    ()=>{

      startReply({

        messageKey:key,

        name:
          d.name
          ||
          "名無し",

        text:
          d.text
          ||
          "",

        icon:
          d.icon
          ||
          "https://via.placeholder.com/40"

      });

    };


  actions.appendChild(replyBtn);


  /* ---------------------
     組み立て
  --------------------- */

  wrap.appendChild(nameLine);

  wrap.appendChild(bubble);

  wrap.appendChild(actions);


  div.appendChild(avatar);

  div.appendChild(wrap);


  messages.appendChild(div);


  messages.scrollTop =
    messages.scrollHeight;

}


/* =====================
   返信開始
===================== */

function startReply(data){

  replyData = data;


  const replyBar =
    document.getElementById("replyBar");

  const replyingText =
    document.getElementById("replyingText");


  replyBar.style.display =
    "flex";


  replyingText.textContent =
    `${data.name} に返信: ${data.text}`;


  document.getElementById("msg")
    .focus();

}


/* =====================
   返信キャンセル
===================== */

function cancelReply(){

  replyData = null;


  document.getElementById("replyBar")
    .style.display =
    "none";


  document.getElementById("replyingText")
    .textContent =
    "";

}


/* =====================
   オンライン表示
===================== */

let onlineStarted = false;

function listenOnline(){

  if(onlineStarted){
    return;
  }

  onlineStarted = true;


  onValue(
    ref(db,`${ROOT}/users`),
    (snap)=>{

      const onlineElement =
        document.getElementById("online");

      if(!onlineElement){
        return;
      }


      const data =
        snap.val()
        ||
        {};


      const users =
        Object.values(data)
        .filter(
          user => user && user.online
        );


      if(users.length === 0){

        onlineElement.textContent =
          "0人";

        return;

      }


      const names =
        users
        .map(
          user =>
            user.name
            ||
            "名無し"
        )
        .join("、");


      onlineElement.textContent =
        `${users.length}人 (${names})`;

    }
  );

}


/* =====================
   アイコン設定
===================== */

function openIconPanel(){

  document.getElementById("iconUrl")
    .value =
    myIcon;


  document.getElementById("iconPanel")
    .style.display =
    "flex";

}


function closeIconPanel(){

  document.getElementById("iconPanel")
    .style.display =
    "none";

}


async function saveIcon(){

  const input =
    document.getElementById("iconUrl");

  const newIcon =
    input.value.trim();


  if(!newIcon){

    alert(
      "画像URLを入力してください"
    );

    return;

  }


  myIcon = newIcon;


  localStorage.setItem(
    "mvlsm_icon",
    myIcon
  );


  /* ログイン済みなら
     Firebase上のユーザー情報も更新 */

  if(userId){

    try{

      await set(
        ref(
          db,
          `${ROOT}/users/${userId}`
        ),
        {

          name:username,

          online:true,

          icon:myIcon,

          isAdmin:isAdmin

        }
      );

    }catch(e){

      console.error(e);

    }

  }


  closeIconPanel();

  alert(
    "アイコンを保存しました！\n次のメッセージから使用されます。"
  );

}


/* =====================
   初期化
===================== */

window.addEventListener(
  "DOMContentLoaded",
  ()=>{


    /* 入室 */

    document
      .getElementById("loginBtn")
      .addEventListener(
        "click",
        login
      );


    /* 管理者 */

    document
      .getElementById("adminBtn")
      .addEventListener(
        "click",
        adminCheck
      );


    /* Enterで入室 */

    document
      .getElementById("pass")
      .addEventListener(
        "keydown",
        (e)=>{

          if(e.key === "Enter"){

            e.preventDefault();

            login();

          }

        }
      );


    /* 送信 */

    document
      .getElementById("sendBtn")
      .addEventListener(
        "click",
        sendMessage
      );


    /* Enter送信 */

    document
      .getElementById("msg")
      .addEventListener(
        "keydown",
        (e)=>{

          if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

          }

        }
      );


    /* 返信キャンセル */

    document
      .getElementById("cancelReplyBtn")
      .addEventListener(
        "click",
        cancelReply
      );


    /* アイコン設定を開く */

    document
      .getElementById("iconSettingBtn")
      .addEventListener(
        "click",
        openIconPanel
      );


    /* アイコン保存 */

    document
      .getElementById("saveIconBtn")
      .addEventListener(
        "click",
        saveIcon
      );


    /* アイコン設定を閉じる */

    document
      .getElementById("closeIconBtn")
      .addEventListener(
        "click",
        closeIconPanel
      );

  }
);

</script>

</body>
</html>
